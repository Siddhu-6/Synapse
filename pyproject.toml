[project]
name = "synapse"
version = "0.1.0"
description = "Personal agentic AI assistant: LangGraph + MCP + Obsidian"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "mcp>=1.28,<2",  # pinned <2 for CrewAI compatibility
  "httpx>=0.28",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "jsonschema>=4.23",
  "ddgs>=9.0",            # keyless multi-backend web search
  "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
crew = ["crewai>=0.80"]
google = ["google-api-python-client>=2.150", "google-auth-oauthlib>=1.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "httpx>=0.28", "asgi-lifespan>=2.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["synapse*"]

[project.scripts]
synapse = "synapse.cli:main"
synapse-api = "synapse.api:main"
