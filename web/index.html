<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0c" />
    <meta name="description" content="Synapse — a multi-agent assistant that plans, acts through MCP tools, asks before anything risky, and files what matters in your notes." />
    <title>Synapse</title>
    <script>
      /* apply the saved theme before first paint, so there is no flash (dark unless you chose light) */
      try { document.documentElement.dataset.theme = localStorage.getItem('synapse_theme') === 'light' ? 'light' : 'dark' }
      catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
