name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]" ruff
      - name: Lint
        run: ruff check synapse evals tests
      - name: Tests (real graph + MCP servers, scripted model)
        run: pytest -q
      - name: Evaluation suite
        run: python -m evals.run
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: data/evals/latest.json }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t synapse:ci .
